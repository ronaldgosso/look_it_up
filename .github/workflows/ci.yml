name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main", "phase-*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Core, Native & WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build native FFI library and run llmw-bench
        run: |
          cargo build --release -p llmw-native
          ./target/release/llmw-bench

      - name: Build release WebAssembly target
        run: cargo build --target wasm32-unknown-unknown --release -p llmw-wasm

  python:
    name: Python Package, Native Parity & FastAPI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build release llmw-native shared library
        run: cargo build --release -p llmw-native

      - name: Install Python package with dev and API extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev,api]"

      - name: Run pytest suite
        run: pytest -v

      - name: Verify web asset export script
        run: python scripts/export_web_assets.py

  web:
    name: Web Studio Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release llmw-wasm binary
        run: |
          cargo build --target wasm32-unknown-unknown --release -p llmw-wasm
          cp target/wasm32-unknown-unknown/release/llmw_wasm.wasm web/public/llmw_wasm.wasm

      - name: Install dependencies, run Vitest, and build production bundle
        working-directory: web
        run: |
          npm ci
          npm run test
          npm run build
